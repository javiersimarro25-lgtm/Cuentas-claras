<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas Claras</title>
<meta name="description" content="Control de gastos a partir de los extractos de tu banco.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow ledger column, sticky month bar on top, tab bar fixed at the bottom (thumb reach on phones). */
:root{
  --bg:#eef2f1; --surface:#fbfcfc; --surface-2:#f3f6f5; --ink:#122420; --ink-2:#465753; --muted:#6c7c77;
  --line:#d9e1de; --accent:#1d47b8; --accent-ink:#ffffff; --accent-soft:#e3e9fa; --bar:#aebde3;
  --good:#14803c; --good-soft:#dff2e5; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#c2372f; --bad-soft:#f9e1de;
  --shadow:0 1px 2px rgba(18,36,32,.06),0 6px 24px rgba(18,36,32,.06);
  --hero-bg:#1d47b8; --hero-ink:#ffffff; --hero-ink-2:rgba(255,255,255,.8); --hero-track:rgba(255,255,255,.24); --hero-warn:#ffc65c;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1312; --surface:#151d1b; --surface-2:#1b2422; --ink:#e6eeeb; --ink-2:#a9b7b3; --muted:#83938e;
  --line:#28332f; --accent:#89a4ff; --accent-ink:#0b1430; --accent-soft:#1e2948; --bar:#3a4c80;
  --good:#4cc47a; --good-soft:#163222; --warn:#e6ad3c; --warn-soft:#3a2d12; --bad:#f07067; --bad-soft:#3e1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); --hero-bg:#1c2b5e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1312; --surface:#151d1b; --surface-2:#1b2422; --ink:#e6eeeb; --ink-2:#a9b7b3; --muted:#83938e;
  --line:#28332f; --accent:#89a4ff; --accent-ink:#0b1430; --accent-soft:#1e2948; --bar:#3a4c80;
  --good:#4cc47a; --good-soft:#163222; --warn:#e6ad3c; --warn-soft:#3a2d12; --bad:#f07067; --bad-soft:#3e1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); --hero-bg:#1c2b5e; color-scheme:dark;}

*{box-sizing:border-box}
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,label,a{-webkit-tap-highlight-color:transparent}
.field,.sheet input,.sheet select{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.status{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthsw{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthsw span{min-width:118px;text-align:center;font-weight:600;font-size:.9rem}
.iconbtn{width:34px;height:34px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}

/* Panels */
.view{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.banner{border-radius:12px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.ex{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}

/* Hero */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-num);font-size:clamp(2rem,9vw,2.8rem);font-weight:600;letter-spacing:-.04em;line-height:1.05}
.hero-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem}
.hero-row .num{font-weight:600}
.delta{font-size:.85rem;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)} .delta.flat{color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over i{background:var(--bad)} .meter.near i{background:var(--warn)}

/* Category rows */
.cats{display:flex;flex-direction:column;gap:4px}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 6px;border-radius:10px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.cat:hover{background:var(--surface-2)}
.cat .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.cat .amt{font-family:var(--f-num);font-weight:600;text-align:right}
.cat .track{grid-column:1/-1;position:relative;height:8px;border-radius:99px;background:var(--surface-2)}
.cat .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.cat .track i.over{background:var(--bad)} .cat .track i.near{background:var(--warn)}
.cat .track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}
.cat .sub{grid-column:1/-1;font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.near{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--bad-soft);color:var(--bad)}

/* Month chart */
.chart{position:relative;padding-left:52px;height:180px}
.chart .grid{position:absolute;left:52px;right:0;top:12px;bottom:26px}
.chart .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.chart .gl span{position:absolute;right:calc(100% + 8px);top:-.6em;font-size:.68rem;color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.chart .gl.base{border-top-color:var(--ink-2);opacity:.5}
.bars{position:absolute;left:52px;right:0;top:12px;bottom:0;display:flex;gap:8px;align-items:stretch}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer;border:0;background:transparent;padding:0}
.bcol .area{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bcol .b{width:min(70%,40px);background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bcol.sel .b{background:var(--accent)}
.bcol .ml{height:26px;display:flex;align-items:center;font-size:.72rem;color:var(--muted)}
.bcol.sel .ml{color:var(--ink);font-weight:700}
.bcol .vl{position:absolute;bottom:calc(var(--h) + 4px);font-size:.68rem;font-family:var(--f-num);font-weight:600;white-space:nowrap}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%)}

/* Transactions */
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1 1 140px;min-width:0}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
select.field{padding-right:28px}
.daygrp{display:flex;flex-direction:column}
.dayh{display:flex;justify-content:space-between;padding:12px 4px 6px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.tx:hover{background:var(--surface-2)}
.tx .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.tx .a.pos{color:var(--good)}
.tx .m{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.auto{border-style:dashed}
.tx .x{color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* Import */
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.map label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink-2);font-weight:600;min-width:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.r{text-align:right;font-family:var(--f-num)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.stats b{font-family:var(--f-num)}
.hints{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.hint{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.8rem;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.hint b{color:var(--ink);font-size:.88rem}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}

/* Settings lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li input.field{width:110px;flex:0 0 auto;text-align:right;font-family:var(--f-num)}
.kbd{font-family:var(--f-num);font-size:.85rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,13,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:.85rem;font-weight:600;cursor:pointer}
.catgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button:hover{background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (max-width:420px){.monthsw span{min-width:96px;font-size:.84rem}.nav button{font-size:.66rem}}
.bk{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0;padding-top:0}
.bk .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bk .hd b{font-size:.98rem}
.bk .sub{font-size:.82rem;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meter{position:relative}
.meter b.mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}
.health{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.hrow:first-child{border-top:0;padding-top:0}
.hrow .v{font-family:var(--f-num);font-weight:600}
.hrow .d{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.tips li::marker{color:var(--accent)}
.grpseg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:0 0 auto}
.grpseg button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:600;cursor:pointer}
.grpseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fine{font-size:.78rem;color:var(--muted);margin:0}
.hero2{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hrow2{display:flex;gap:16px;align-items:center}
.ring{width:104px;height:104px;flex:0 0 auto}
.htext{display:flex;flex-direction:column;gap:4px;min-width:0}
.hl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--hero-ink-2)}
.hero2 .big{font-family:var(--f-num);font-size:clamp(1.9rem,8.5vw,2.6rem);font-weight:600;letter-spacing:-.04em;line-height:1.05}
.hs{font-size:.86rem;color:var(--hero-ink-2)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-track);padding-top:12px}
.hgrid div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hgrid span{font-size:.7rem;color:var(--hero-ink-2);line-height:1.2}
.hgrid b{font-family:var(--f-num);font-size:1rem;font-weight:600}
.hdelta .delta{color:var(--hero-ink)}
.hbtn{margin-top:6px;align-self:flex-start;border:1px solid var(--hero-track);background:transparent;color:var(--hero-ink);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;text-align:left}
.hbtn:hover{background:var(--hero-track)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.gform label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--ink-2);min-width:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Cuentas Claras</b><span class="status" id="status">Cargando…</span></div>
    <div class="monthsw" role="group" aria-label="Mes">
      <button class="iconbtn" data-act="mprev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="mlabel">—</span>
      <button class="iconbtn" data-act="mnext" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <main>
    <section class="view" id="v-resumen"></section>
    <section class="view" id="v-movimientos" hidden></section>
    <section class="view" id="v-plan" hidden></section>
    <section class="view" id="v-importar" hidden></section>
    <section class="view" id="v-ajustes" hidden></section>
  </main>

/* ---------- Persistence ---------- */
const LS_KEY='cuentas-claras-v1';
const dirty=new Set(); const chains={}; let saveTimer=null;
function markDirty(k){ dirty.add(k); clearTimeout(saveTimer); saveTimer=setTimeout(flush,450); }
function flush(){
  clearTimeout(saveTimer);
  if(store.mode==='local'){ dirty.clear(); saveLocal(); return; }
  if(store.mode!=='db') return;
  const keys=[...dirty]; dirty.clear();
  for(const k of keys){
    const path=k==='settings'?`data/users/${store.uid}/settings`:`data/users/${store.uid}/m-${k}`;
    const body=k==='settings'?{...settings,v:1}:(months[k]&&months[k].length?{items:months[k]}:null);
    chains[k]=(chains[k]||Promise.resolve()).then(()=>{
      const ref=store.db.doc(path); return body?ref.set(JSON.parse(JSON.stringify(body))):ref.delete();
    }).catch(e=>writeFailed(e));
  }
}
function writeFailed(e){
  const code=e&&e.code;
  if(code==='quota_exceeded') toast('No queda espacio para guardar más datos. Borra meses antiguos en Ajustes.');
  else if(code==='invalid_argument') toast('Este mes tiene demasiados movimientos para guardarlo en un bloque.');
  else toast('No se pudo guardar el último cambio. Revisa la conexión y vuelve a intentarlo.');
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({settings,months})); }catch(e){ toast('No se pudo guardar en el dispositivo. Descarga una copia de seguridad.'); } }
function loadLocal(){
  if(dirty.size){ store.ready=true; saveLocal(); dirty.clear(); rebuildRules(); afterLoad(); return; }
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); settings=normalizeSettings(o.settings); months=o.months&&typeof o.months==='object'?o.months:{}; } }catch(e){}
  rebuildRules(); store.ready=true; afterLoad();
}
function applySnapshot(snap){
  let s=null; const fresh={};
  for(const doc of snap.docs){
    if(!doc.exists) continue;
    const body=doc.data()||{};
    if(doc.id==='settings') s=body;
    else if(doc.id.startsWith('m-')) fresh[doc.id.slice(2)]=Array.isArray(body.items)?body.items.map(t=>({...t})):[];
  }
  for(const k of dirty){ if(k==='settings') continue; if(months[k]) fresh[k]=months[k]; else delete fresh[k]; }
  months=fresh;
  if(!dirty.has('settings')) settings=normalizeSettings(s);
  rebuildRules();
  const first=!store.ready; store.ready=true;
  if(first){ afterLoad(); if(dirty.size) flush(); } else renderAll();
}
function afterLoad(){
  if(!isDemo() && !months[selM]){ const keys=Object.keys(months).filter(k=>months[k].length).sort(); if(keys.length) selM=keys[keys.length-1]; }

function upsertTx(tx,oldKey){
  const k=tx.d.slice(0,7);
  if(oldKey&&oldKey!==k&&months[oldKey]){ months[oldKey]=months[oldKey].filter(t=>t.id!==tx.id); markDirty(oldKey); }
  const arr=months[k]=months[k]||[]; const i=arr.findIndex(t=>t.id===tx.id);
  if(i>=0) arr[i]=tx; else arr.push(tx);

}
function removeTx(id,k){ if(!months[k]) return; months[k]=months[k].filter(t=>t.id!==id); markDirty(k); }
function recategorizeAll(){

/* ---------- Stats ---------- */
function stats(k){
  const items=monthItems(k); let spend=0,inc=0; const byCat={},byAcc={};
  for(const t of items){ const c=catById(t.c); if(c.t==='x') continue;
    if(c.t==='i'){ inc+=t.a; continue; }
    spend-=t.a; byCat[c.id]=(byCat[c.id]||0)-t.a; byAcc[t.acc]=(byAcc[t.acc]||0)-t.a; }
  return {spend,inc,byCat,byAcc,n:items.length};
}

/* ---------- Insights: income, fixed payments, forecast ---------- */
const titleKey=k=>k.split(' ').map(w=>w?w.charAt(0).toUpperCase()+w.slice(1):w).join(' ');
function incomeFor(k){
  const man=+planCfg().income[k]||0; if(man) return {v:man,src:'previsto'};
  const st=stats(k), avg=avgPrev(k);
  if(k>=TODAY_KEY&&avg&&avg.inc>st.inc) return {v:avg.inc,src:'media'};
  if(st.inc>0) return {v:st.inc,src:'real'};
  if(avg&&avg.inc>0) return {v:avg.inc,src:'media'};
  return {v:0,src:''};
}
const NOT_FIXED=new Set(['super','gas','rest','efectivo','bizum']);
function detectRecurring(refK){
  const d=data(); const keys=Object.keys(d).filter(m=>m<=refK&&d[m].length).sort().slice(-6);
  if(keys.length<2) return [];
  const groups={};
  for(const m of keys) for(const t of d[m]){
    if(t.a>=0) continue; const c=catById(t.c); if(c.t!=='g'||NOT_FIXED.has(c.id)) continue;
    const key=merchantKey(t.t)||norm(t.t); if(!key) continue; (groups[key]=groups[key]||[]).push({t,m});
  }
  const out=[];
  for(const key in groups){
    const g=groups[key]; const ms=[...new Set(g.map(x=>x.m))].sort();
    if(ms.length<2||g.length/ms.length>1.5) continue;
    if(ms[ms.length-1]<shiftM(refK,-1)) continue;                 // stopped paying it
    const amts=g.map(x=>-x.t.a).sort((a,b)=>a-b); if(amts[amts.length-1]/amts[0]>1.8) continue;
    const days=g.map(x=>+x.t.d.slice(8)).sort((a,b)=>a-b);
    const recent=g.slice().sort((a,b)=>b.t.d.localeCompare(a.t.d))[0].t;
    const now=g.filter(x=>x.m===refK);
    out.push({key,name:titleKey(key),amount:amts[Math.floor(amts.length/2)],day:days[Math.floor(days.length/2)],cat:recent.c,charged:now.length>0,chargedAmt:now.reduce((s,x)=>s-x.t.a,0)});
  }
  return out.sort((a,b)=>b.amount-a.amount);
}
function forecast(k){
  if(k!==TODAY_KEY) return null;
  const st=stats(k); const rec=detectRecurring(k);
  const pendingFixed=rec.filter(r=>!r.charged).reduce((s,r)=>s+r.amount,0);
  const fixedCharged=rec.filter(r=>r.charged).reduce((s,r)=>s+r.chargedAmt,0);
  const day=today.getDate(); const dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate(); const rest=dim-day;
  let rate=Math.max(0,st.spend-fixedCharged)/day;
  const avg=avgPrev(k);
  if(day<7&&avg){ const fixedAll=rec.reduce((s,r)=>s+r.amount,0); rate=Math.max(0,avg.spend-fixedAll)/30.4; }
  return {pendingFixed,rate,rest,total:st.spend+pendingFixed+rate*rest,rec};
}
function ringSvg(p,over){

function merchantsCard(k){

function monthsUntil(a,b){ if(!b) return 12; const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1)+1; }

/* ---------- Plan (saving & budget plan) ---------- */
const METHODS={
  equilibrado:{n:'Equilibrado',d:'50 % necesidades · 30 % caprichos · 20 % ahorro. La regla clásica.',need:.5,want:.3,save:.2},
  ajustado:{n:'Ajustado',d:'60 % necesidades · 30 % caprichos · 10 % ahorro. Si el alquiler y los fijos pesan mucho.',need:.6,want:.3,save:.1},
  ahorrador:{n:'Ahorrador',d:'50 % necesidades · 20 % caprichos · 30 % ahorro. Para llegar antes a una meta.',need:.5,want:.2,save:.3}
};
const NEED_DEFAULT=new Set(['super','trans','gas','hogar','salud','comis']);
function planCfg(){ const p=settings.plan||{}; return {method:METHODS[p.method]?p.method:'equilibrado',income:p.income&&typeof p.income==='object'?p.income:{},groups:p.groups&&typeof p.groups==='object'?p.groups:{},fund:+p.fund||0,goals:Array.isArray(p.goals)?p.goals.filter(g=>g&&g.id&&g.n):[]}; }
function setPlan(patch){ settings.plan={...planCfg(),...patch}; markDirty('settings'); }
function groupOf(c){ const g=planCfg().groups[c.id]; return g==='n'||g==='d'?g:(NEED_DEFAULT.has(c.id)?'n':'d'); }
function bucketSpend(k){ const st=stats(k); let n=0,d=0; for(const c of settings.cats){ if(c.t!=='g') continue; const v=st.byCat[c.id]||0; if(groupOf(c)==='n') n+=v; else d+=v; } return {n,d,st}; }
function avgPrev(k){
  const ks=[1,2,3].map(i=>shiftM(k,-i)).filter(m=>monthItems(m).length);
  if(!ks.length) return null;
  const a={n:0,d:0,inc:0,spend:0,byCat:{},months:ks.length};
  ks.forEach(m=>{ const b=bucketSpend(m); a.n+=b.n; a.d+=b.d; a.inc+=b.st.inc; a.spend+=b.st.spend; for(const c in b.st.byCat) a.byCat[c]=(a.byCat[c]||0)+b.st.byCat[c]; });
  const n=ks.length; a.n/=n; a.d/=n; a.inc/=n; a.spend/=n; for(const c in a.byCat) a.byCat[c]/=n; return a;
}
const round5=v=>Math.max(0,Math.round(v/5)*5);
function daysLeftIn(k){ const [y,m]=k.split('-').map(Number); const dim=new Date(y,m,0).getDate(); if(k===TODAY_KEY) return dim-today.getDate()+1; return k>TODAY_KEY?dim:0; }
// Needs keep their usual level (rent can't be cut by a budget); wants get what is left after saving, scaled down only if needed.
function suggestBudgets(income,M,src){
  const out={}; const gcats=settings.cats.filter(c=>c.t==='g');
  const needs=gcats.filter(c=>groupOf(c)==='n'), wants=gcats.filter(c=>groupOf(c)==='d');
  let needSum=0; needs.forEach(c=>{ out[c.id]=round5(Math.max(0,src[c.id]||0)); needSum+=out[c.id]; });
  const allowance=Math.max(0,income-income*M.save-needSum);
  const wsum=wants.reduce((s,c)=>s+Math.max(0,src[c.id]||0),0);
  const f=wsum>0?Math.min(1,allowance/wsum):0;
  wants.forEach(c=>{ out[c.id]=round5(Math.max(0,src[c.id]||0)*f); });
  return {out,needSum,allowance,wsum,cut:wsum>allowance};
}
function stateFor(ratio,limit){ if(ratio>=1) return ['over','✕ Pasado']; if(ratio>=.85) return ['near','! Cerca']; return ['ok','✓ Bien']; }

    ${!manual&&income?`<p class="fine">Mientras no lo escribas, uso ${IF.src==='media'?'tu media de ingresos':'lo que ya has cobrado este mes'}: ${eur(income)}.</p>`:''}

function wireDrop(){
  const d=$('#drop'), f=$('#file'); if(!d) return;
  f.addEventListener('change',()=>{ if(f.files[0]) loadFile(f.files[0]); });
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});
  d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over'); const file=e.dataTransfer.files[0]; if(file) loadFile(file);});
}
async function readRows(file){
  const name=file.name.toLowerCase(); const buf=await file.arrayBuffer();
  if(/\.(csv|txt|tsv)$/.test(name)){ let text; try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('windows-1252').decode(buf); } return parseCSV(text); }
  if(!window.XLSX) throw new Error('nolib');
  const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  let first=null;
  for(const sn of wb.SheetNames){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}); if(!first) first=rows; if(detectLayout(rows)) return rows; }
  return first||[];
}
async function loadFile(file){
  imp={err:''}; renderImport();
  try{
    const rows=await readRows(file);
    if(!rows.length) throw new Error('empty');
    const L=detectLayout(rows)||detectAt(rows,0);
    const guess=guessBank(rows,L.ok?L:null);
    imp={name:file.name,rows,L,guess,acc:guess&&settings.accounts.includes(guess)?guess:(guess||''),invert:false};
    if(guess) ensureAccount(guess);
    recompute();
  }catch(e){
    imp={err:e&&e.message==='nolib'?'No se ha podido cargar el lector de Excel. Recarga la página o exporta el extracto en CSV.':'No he podido leer ese archivo. Prueba a descargar el extracto en Excel (.xlsx) o CSV.'};
  }
  renderImport();
}
function recompute(){
  imp.list=imp.L.date>=0?extractTx(imp.rows,imp.L,{invert:imp.invert}):[];
  imp.plan=planImport(imp.list,imp.acc);
}
function planImport(list,acc){
  const existing=new Set(); for(const k in months) for(const t of months[k]) if(t.acc===acc&&t.h) existing.add(t.h);
  const seen={}; const fresh=[]; let dup=0;
  for(const r of list){ const base=`${acc}|${r.d}|${r.a.toFixed(2)}|${norm(r.t)}`; const n=seen[base]=(seen[base]||0)+1; const h=h53(base+'#'+n);
    if(existing.has(h)){dup++;continue;} fresh.push({...r,h}); }
  return {fresh,dup};
}
function commitImport(){
  const {fresh,dup}=imp.plan; const acc=imp.acc; ensureAccount(acc);
  const touched=new Set();
  for(const r of fresh){ const tx={id:newId(),d:r.d,a:r.a,t:r.t,x:r.x||'',acc,c:categorize(r.t,r.x,r.a),h:r.h}; const k=r.d.slice(0,7); (months[k]=months[k]||[]).push(tx); touched.add(k); }
  for(const k of touched){ months[k].sort((a,b)=>b.d.localeCompare(a.d)); markDirty(k); }
  const last=[...touched].sort().pop(); if(last) selM=last;
  imp={done:`Importados <b>${fresh.length}</b> movimientos de ${esc(acc)}${dup?` · ${dup} ya estaban`:''}.`};
  renderAll();
}

async function saveFile(filename,data){
  const type=filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json';
  const blob=new Blob([data],{type});
  try{
    const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function allTxSorted(){ return Object.values(months).flat().sort((a,b)=>a.d.localeCompare(b.d)); }
function exportXlsx(){
  if(!window.XLSX){ toast('No se ha podido cargar el generador de Excel.'); return; }
  const rows=[['Fecha','Concepto','Importe (€)','Categoría','Cuenta','Detalle']].concat(allTxSorted().map(t=>{const [y,m,d]=t.d.split('-').map(Number); return [new Date(y,m-1,d),t.t,t.a,catById(t.c).n,t.acc||'',t.x||''];}));
  const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true}); ws['!cols']=[{wch:11},{wch:40},{wch:12},{wch:22},{wch:12},{wch:30}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Movimientos');
  const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  saveFile(`gastos-${new Date().toISOString().slice(0,10)}.xlsx`,out);
}
function exportJson(){ saveFile(`cuentas-claras-copia-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'cuentas-claras',v:1,settings,months})); }
async function restoreBackup(file){
  try{ const o=JSON.parse(await file.text()); if(!o||o.app!=='cuentas-claras'||typeof o.months!=='object') throw 0;
    const old=Object.keys(months); settings=normalizeSettings(o.settings); months={};
    for(const k in o.months){ if(/^\d{4}-\d{2}$/.test(k)&&Array.isArray(o.months[k])) months[k]=o.months[k].filter(t=>t&&t.id&&t.d&&typeof t.a==='number'); }
    new Set([...old,...Object.keys(months)]).forEach(k=>markDirty(k)); markDirty('settings'); rebuildRules(); afterLoad(); toast('Copia restaurada');
  }catch(e){ toast('Ese archivo no es una copia de Cuentas Claras.'); }
}

    case 'goaladd': { const id=el.dataset.id; const n=parseNum(($('#ga-'+id)||{}).value); if(!n){ toast('Escribe una cantidad. Usa un número negativo para sacar dinero.'); break; }
      const c=planCfg(); setPlan({goals:c.goals.map(g=>g.id===id?{...g,saved:Math.max(0,Math.round(((+g.saved||0)+n)*100)/100)}:g)}); renderAll(); toast(n>0?'Añadido a la meta':'Retirado de la meta'); break; }
    case 'goaldel': { const id=el.dataset.id; if(goalDel!==id){ goalDel=id; renderAll(); break; } goalDel=''; const c=planCfg(); setPlan({goals:c.goals.filter(g=>g.id!==id)}); renderAll(); toast('Meta quitada'); break; }
    case 'planmethod': setPlan({method:el.dataset.m}); renderAll(); break;
    case 'useavginc': { const c=planCfg(); setPlan({income:{...c.income,[selM]:+el.dataset.v}}); renderAll(); break; }
    case 'plangroup': { const c=planCfg(); setPlan({groups:{...c.groups,[el.dataset.c]:el.dataset.g}}); renderAll(); break; }
    case 'applybudgets': { const c=planCfg(); const st=stats(selM); const inc=+c.income[selM]||st.inc; const avg=avgPrev(selM); if(!inc) break;
      const M=METHODS[c.method]; const sug=suggestBudgets(inc,M,avg?avg.byCat:st.byCat); const b={};
      for(const k in sug.out) if(sug.out[k]>0) b[k]=sug.out[k];
      b._total=round5(inc-inc*M.save); settings.budgets=b; markDirty('settings'); renderAll(); toast('Presupuestos aplicados. Puedes cambiarlos en Ajustes.'); break; }
    case 'impcancel': imp=null; renderImport(); break;
    case 'impacc': imp.acc=el.dataset.acc; recompute(); renderImport(); break;
    case 'newacc': { const holder=el.parentElement; if(holder.querySelector('#na')) break; const w=document.createElement('span'); w.className='row'; w.innerHTML='<input class="field" id="na" placeholder="Nombre de la cuenta" style="width:170px"><button class="btn sm pri" data-act="newaccok">Añadir</button>'; holder.appendChild(w); $('#na').focus(); break; }
    case 'newaccok': { const n=($('#na').value||'').trim().slice(0,30); if(n){ ensureAccount(n); imp.acc=n; recompute(); renderImport(); } break; }
    case 'impgo': commitImport(); break;
    case 'addrule': { const k=$('#r-k').value.trim(), c=$('#r-c').value; if(!norm(k)){ toast('Escribe una palabra del concepto.'); break; } settings.rules=settings.rules.filter(r=>norm(r.k)!==norm(k)); settings.rules.push({k,c}); markDirty('settings'); recategorizeAll(); renderAll(); toast('Regla añadida y aplicada'); break; }
    case 'delrule': settings.rules.splice(+el.dataset.i,1); markDirty('settings'); recategorizeAll(); renderAll(); break;
    case 'addcat': { const n=$('#c-n').value.trim().slice(0,30); if(!n) break; settings.cats.splice(settings.cats.length-2,0,{id:'c'+newId(),n,t:$('#c-t').value}); markDirty('settings'); renderAll(); break; }
    case 'delcat': { const id=el.dataset.id; settings.cats=settings.cats.filter(c=>c.id!==id); settings.rules=settings.rules.filter(r=>r.c!==id); delete settings.budgets[id];
      for(const k in months){ let ch=false; for(const t of months[k]) if(t.c===id){ t.c=categorize(t.t,t.x,t.a); t.m=0; ch=true; } if(ch) markDirty(k); }
      markDirty('settings'); rebuildRules(); renderAll(); break; }
    case 'addaccset': { const n=$('#a-n').value.trim().slice(0,30); if(n){ ensureAccount(n); renderAjustes(); } break; }
    case 'exportxlsx': exportXlsx(); break;
    case 'exportjson': exportJson(); break;
    case 'wipe': confirmWipe=true; renderAjustes(); break;
    case 'wipeno': confirmWipe=false; renderAjustes(); break;
    case 'wipeyes': { Object.keys(months).forEach(k=>{ months[k]=[]; markDirty(k); }); settings=defaultSettings(); markDirty('settings'); rebuildRules(); confirmWipe=false; renderAll(); toast('Datos borrados'); break; }
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='f-q'){ filt.q=e.target.value; renderMovs(); } });
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='p-inc'||id==='p-fund'){ const n=parseNum(e.target.value); const val=n&&n>0?Math.round(Math.abs(n)*100)/100:0; const c=planCfg();
    if(id==='p-inc'){ const inc={...c.income}; if(val) inc[selM]=val; else delete inc[selM]; setPlan({income:inc}); } else setPlan({fund:val});
    renderAll(); toast('Guardado'); return; }
  if(id==='f-cat'){ filt.cat=e.target.value; renderMovs(); }
  else if(id==='f-acc'){ filt.acc=e.target.value; renderMovs(); }
  else if(imp&&imp.rows&&/^m-/.test(id)){
    const v=+e.target.value;
    if(id==='m-hdr'){ const keepAcc=imp.acc; imp.L=detectAt(imp.rows,v); imp.acc=keepAcc; }
    else if(id==='m-inv') imp.invert=e.target.checked;
    else { const f=id.slice(2); imp.L[f]=v; imp.L.ok=imp.L.date>=0&&(imp.L.amount>=0||imp.L.cargo>=0||imp.L.abono>=0); }
    recompute(); renderImport();
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet){ sheet=null; drawSheet(); } });
let toastT=null;
function toast(msg){ const r=$('#toast-root'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML='';},2600); }

/* ---------- Boot ---------- */
rebuildRules();
demoMonths=genDemo();
const h=(location.hash||'').slice(1); if(['resumen','movimientos','plan','importar','ajustes'].includes(h)) setTab(h,false);
renderAll();
initStore();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
